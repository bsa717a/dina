# Push to main builds Dina from source and deploys Cloud Run service `dina`.
#
# This repo has no root Dockerfile. `gcloud run deploy --source` builds with
# the google-24 builder. This build pins gcr.io/buildpacks/builder:google-24
# instead of the floating :latest tag. The google-22 tag is not used.
#
# GOOGLE_RUNTIME_VERSION=22 pins Node 22. google-24 supports it. That is
# the Node major of the Cloud Run image defined for service dina (node:22)
# and the version this app recommends. Without the pin, latest picks the
# newest Node on that builder.
#
# The trigger in us-central1 on connection Piper-Dina must use
# dina-cloudbuild@dina-pm.iam.gserviceaccount.com. Pass the linked
# repository id as _LINKED_REPO (it overrides the placeholder below).
# automapSubstitutions is off. Cloud Build substitutes $COMMIT_SHA,
# $BUILD_ID, and $_LINKED_REPO in YAML fields, but does not export them
# into a step's environment. Scripts that read those names need an env
# entry. migrate-image sets COMMIT_SHA. The migrate step sets
# COMMIT_SHA, BUILD_ID, and _LINKED_REPO. The traffic step sets
# _LINKED_REPO; its $COMMIT_SHA stays in the YAML script, which Cloud
# Build substitutes before the step runs.
#
# Before the new revision is created, Cloud Run job `dina-migrate` runs
# `prisma migrate deploy` against Cloud SQL `dina-pm:us-central1:dina-pg`.
# The job uses the same Unix socket and Secret Manager secret the service
# already uses (`dina-database-url` mounted as DATABASE_URL). If the job
# fails, the build stops. The service deploy below does not run, and
# traffic stays where it is.
#
# deploy/migrate.Dockerfile builds only that job image. pack does not use it.
#
# Deploy uses --no-traffic and a revision name unique to this build.
# Immediately before cutover, the build checks that $COMMIT_SHA is still
# the head of main. Only then does it send 100% to that revision. If main
# has moved, it exits and leaves traffic where it is.
# The service deploy does not set, update, or clear Cloud Run env vars,
# Secret Manager bindings, or Cloud SQL settings on service dina.

serviceAccount: projects/dina-pm/serviceAccounts/dina-cloudbuild@dina-pm.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

substitutions:
  _LINKED_REPO: SET_LINKED_REPO_ID

timeout: 1800s

steps:
  - id: migrate-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - deploy/build-migrate-image.sh
    env:
      - "COMMIT_SHA=$COMMIT_SHA"
    waitFor: ["-"]

  - id: build
    name: gcr.io/k8s-skaffold/pack
    entrypoint: pack
    waitFor: ["-"]
    args:
      - build
      - us-central1-docker.pkg.dev/dina-pm/dina/dina:$COMMIT_SHA
      - --builder=gcr.io/buildpacks/builder:google-24
      - --network=cloudbuild
      - --path=.
      - --env
      - GOOGLE_RUNTIME_VERSION=22
      # Build-time only, so `prisma generate` can read the schema. Not a
      # credential, and not the runtime DATABASE_URL.
      - --env
      - DATABASE_URL=postgresql://prisma:prisma@127.0.0.1:5432/dina
      - --env
      - NEXT_TELEMETRY_DISABLED=1

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/dina-pm/dina/dina:$COMMIT_SHA
    waitFor: ["build"]

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - deploy/run-prod-migrate.sh
    env:
      - "COMMIT_SHA=$COMMIT_SHA"
      - "BUILD_ID=$BUILD_ID"
      - "_LINKED_REPO=$_LINKED_REPO"
    waitFor: ["migrate-image"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - dina
      - --project=dina-pm
      - --region=us-central1
      - --platform=managed
      - --image=us-central1-docker.pkg.dev/dina-pm/dina/dina:$COMMIT_SHA
      - --revision-suffix=${SHORT_SHA}-${BUILD_ID}
      - --no-traffic
      - --quiet
    waitFor: ["push", "migrate"]

  - id: traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        set -o pipefail
        HEAD="$$(bash deploy/github-main-sha.sh)"
        if [ "$$HEAD" != "$COMMIT_SHA" ]; then
          echo "Refusing to move traffic. main is $$HEAD; this build is $COMMIT_SHA."
          exit 1
        fi
        gcloud run services update-traffic dina \
          --project=dina-pm \
          --region=us-central1 \
          --to-revisions=dina-${SHORT_SHA}-${BUILD_ID}=100 \
          --quiet
    env:
      - "_LINKED_REPO=$_LINKED_REPO"
    waitFor: ["deploy"]
